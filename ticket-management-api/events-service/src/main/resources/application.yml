server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myapp
    username: daniels
    password: daniels
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG      
JWT:
  secretkey: "your-very-long-secret-key-that-should-be-kept-safe-and-not-shared"
