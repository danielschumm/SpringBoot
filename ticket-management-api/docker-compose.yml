services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - registration-service
      - events-service
    networks:
      - backend
  registration-service:
    build: ./registration-service
    container_name: registration-service
    environment:
      - SERVER_PORT=8080
    restart: unless-stopped
    networks:
      - backend

  events-service:
    build: ./events-service
    container_name: events-service
    environment:
      - SERVER_PORT=8080
    restart: unless-stopped
    networks:
      - backend

  mongo:
    image: mongo:4.4.29
    container_name: mongo
    networks:
      - backend
  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: daniels
      POSTGRES_PASSWORD: daniels
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - backend
volumes:
  pgdata:
networks:
  backend:

