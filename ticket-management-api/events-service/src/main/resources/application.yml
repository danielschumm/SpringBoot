server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/myapp
    username: daniels
    password: daniels
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis
  datasource:
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 30000
logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG      
    org.springframework.boot.autoconfigure.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
JWT:
  secretkey: "your-very-long-secret-key-that-should-be-kept-safe-and-not-shared"
