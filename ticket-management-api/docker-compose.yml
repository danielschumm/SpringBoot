services:
  registration-service:
    build: ./registration-service
    container_name: registration-service
    ports:
      - '8080:8080'
    depends_on:
      - mongo
      - postgres
      - redis
  events-service:
    build: ./events-service
    container_name: events-service
    ports:
      - '8081:8080'
    depends_on:
      - mongo
      - postgres
      - redis
    restart: unless-stopped
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - '27017:27017'
  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: daniels
      POSTGRES_PASSWORD: daniels
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
volumes:
  pgdata:

